<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
        }
        .main{
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            width: 100%;
            height: 100vh;

            background-image: url(https://i.pinimg.com/originals/0d/ba/57/0dba57a96d995f5b92d6294245ead3eb.jpg);
            background-size: cover;
            background-position: center;
        }

        .glass{
            width: 400px;
            height: 550px;
            border-radius: 10px;
            font-size: 30px;
            font-family: sans-serif;
            font-weight: 900;
            text-transform: uppercase;
            display: flex;
            justify-content: center;
            align-items: center;
            color: rgb(255, 255, 255);
        }
        .filter-1{
            background-color: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(8px);
        }
        .filter-2{
            background-color: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(8px) contrast(200%);
        }
        .filter-3{
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.259), rgba(255, 255, 255, 0.1));
            backdrop-filter: blur(10px) brightness(1.1) contrast(1.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 10px rgba(0, 0, 0, 0.1), inset 0 0 5px rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="filter-1 glass">blur</div>
        <div class="filter-2 glass">contrast</div>
        <div class="filter-3 glass">brightness/border</div>
    </div>
</body>
</html>
