<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="flex">
        <div class="box-1" id="box-1">
            <span id="widthText">Width: 0px</span>
        </div>
    </div>

    <br>

    <div class="flex">
        <div class="box-2" id="box-2">
            <span id="heightText">Height: 0px</span>
        </div>
    </div>

    <script>
        // Получаем элементы для первого блока
        const box1 = document.getElementById('box-1');
        const widthText = document.getElementById('widthText');

        // Функция для обновления ширины первого блока
        function updateWidth() {
            const width = box1.offsetWidth; // Получаем текущую ширину блока
            widthText.textContent = 'Width: ' + width + 'px'; // Обновляем текст с шириной
        }

        // Слушаем изменение окна и обновляем ширину
        window.addEventListener('resize', updateWidth);

        // Изначально показываем текущую ширину первого блока
        updateWidth();

        // Получаем элементы для второго блока
        const box2 = document.getElementById('box-2');
        const heightText = document.getElementById('heightText');

        // Функция для обновления высоты второго блока
        function updateHeight() {
            const height = box2.offsetHeight; // Получаем текущую высоту второго блока
            heightText.textContent = 'Height: ' + height + 'px'; // Обновляем текст с высотой
        }

        // Слушаем изменение окна и обновляем высоту
        window.addEventListener('resize', updateHeight);

        // Изначально показываем текущую высоту второго блока
        updateHeight();
    </script>
</body>
</html>
