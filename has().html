<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">

<!--_______________________________________________________select-effect_______________________________________________________________ -->

        <div class="card"> <!--Основная карточка на котором всё находится-->
            <div class="flex-for-image"> <!--Блок который выравнивает картину по горизонтали по вертикали-->
                <div class="img"> <!--Картина-->
                    <div class="flex-for-select-block"> <!--Блок который выравнивает поле для выбора (пепси-кола)-->
                        <select>
                            <option style="color: black;" value="Pepsimode">Pepsi</option>
                            <option style="color: black;" value="Colamode">Cola</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

<!-- _________________________________________________________hover-effect______________________________________________________________ -->

        <div class="card">
            <div class="hover-effect">
                <div class="box">
                    <p>
                        Наведи сюда
                    </p><br>
                    <button class="hidden">Кликни меня</button> 
                </div>
            </div>
        </div>

<!-- _________________________________________________________input-effect_________________________________________________________ -->
        
        <div class="card">
            <div class="input-effect">
                <div class="wrapper">
                    <input type="text" placeholder="Кликни сюда">
                    <p class="message">Ты начал вводить текст!</p>
                </div>
            </div>
        </div>

<!-- ____________________________________________________transform-effect________________________________________________________ -->
        
        <div class="card">
            <div class="transform-effect">
                <div class="hover-box">Наведи сюда
                    <div class="popup">Я появился!</div>
                </div>
            </div>
        </div>

<!-- _____________________________________________________________________________________________________________________________ -->

    </div>

    <input class="r i" type="radio" name="bgcolor" id="dakr-bg">
    <label class="r " for="dakr-bg">dark</label>
    <input class="r i" type="radio" name="bgcolor" id="light-bg" checked>
    <label class="r" for="light-bg">light</label>
    <input class="r i" type="radio" name="bgcolor" id="normal-bg">
    <label class="r" for="normal-bg">normal</label>
    
</body>
</html>
